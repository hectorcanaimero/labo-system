# Dashboard UX defaults. Applied when a request omits the corresponding
# query param, so URL bookmarks always win.
#
# Ship these defaults with the package; a project can override by dropping
# `<project_root>/dashboard.yaml` — same schema.

# ---------------------------------------------------------------------------
# Docs panel (F0.1.T7)
#
# SPIKE RESULT: orch 0.6.1 dashboard.yaml does NOT support a native
# `docs:` / `links:` / `panels:` section. The dashboard UI is a compiled
# React SPA (orchestrator/spa/) with no template-override mechanism.
# The only override path is `frontend/dist/` which REPLACES the entire
# SPA — that would break kanban/tunnel, so it's descartado.
#
# DECISION: fallback to `docs/index.html` (static hub page with links to
# PRD, ARCH, and architecture diagrams). The `docs:` section below is a
# forward-compatible convention: when orch adds native docs-panel support,
# this data will render automatically. Today it serves as documentation
# for the team and can be consumed by custom tooling.
#
# Access: `open docs/index.html` or serve via any static file server.
# ---------------------------------------------------------------------------
docs:
  index: docs/index.html
  links:
    - label: "PRD"
      path: docs/prd/001-labsystem-v1.md
      type: markdown
    - label: "ARCH"
      path: docs/arch/001-labsystem-arch.md
      type: markdown
    - label: "System Architecture"
      path: docs/arch/diagrams/001-labsystem.diagrams.html
      type: diagram
    - label: "ERD"
      path: docs/arch/diagrams/001-labsystem-erd.diagrams.html
      type: diagram
    - label: "BCV Cron"
      path: docs/arch/diagrams/001-labsystem-bcv-cron.diagrams.html
      type: diagram
    - label: "F5 PDF Generation"
      path: docs/arch/diagrams/001-labsystem-f5-pdf.diagrams.html
      type: diagram
    - label: "F6 Convert"
      path: docs/arch/diagrams/001-labsystem-f6-convert.diagrams.html
      type: diagram
    - label: "Export"
      path: docs/arch/diagrams/001-labsystem-export.diagrams.html
      type: diagram

kanban:
  wip_default: null         # integer or null. null = no WIP badge unless ?wip=N.
  sort_default: null        # "impact" | null (default = phase asc + id asc).
  group_default: null       # "phase" | null.
  refresh_interval_s: 10    # HTMX polling cadence for the board.

# Tunnel: desde orch v0.15 solo Cloudflare quick tunnel (requiere `cloudflared`
# en PATH y un token en el dashboard). autossh/bore ya no se admiten.
tunnel:
  enabled: true
