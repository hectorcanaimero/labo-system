name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Playwright (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labo
          POSTGRES_PASSWORD: labo
          POSTGRES_DB: labo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://labo:labo@localhost:5432/labo_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --no-frozen-lockfile: la suite E2E agrega @playwright/test y postgres
      # como devDeps; se resuelve el lockfile en CI sin exigir un commit previo.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm --filter @labo/web e2e
        env:
          DATABASE_URL: postgres://labo:labo@localhost:5432/labo_e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
